[package]
name = "hero-field"
version = "0.1.0"
edition = "2021"
description = "Hero particle field for gvitolo.me, simulated and rasterized in Rust, run as WebAssembly."
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
